name: Theme source checks

on:
  pull_request:
  push:
    branches: [main, codex/calendar-workbench]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-vm-modules scripts/check-calendar-ui.mjs
      - run: node --experimental-vm-modules scripts/check-notifications-ui.mjs
      - run: node --experimental-vm-modules scripts/check-post-card-helpers.mjs
      - run: node --experimental-vm-modules scripts/check-topic-card-ui.mjs
      - run: node --experimental-vm-modules scripts/check-view-tracker.mjs
      - run: node --experimental-vm-modules scripts/check-composer-ui.mjs
      - run: node --experimental-vm-modules scripts/check-explore-ui.mjs
      - run: node --experimental-vm-modules scripts/check-reporting-ui.mjs
